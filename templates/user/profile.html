{% extends 'base.html' %}
{% block title %}Profile — AgriSmart AI{% endblock %}
{% block content %}

<div style="max-width:500px; margin:48px auto; padding:0 24px;">
  <h1 style="font-size:24px; font-weight:700; color:var(--green-dark); margin-bottom:24px;">My profile</h1>

  <div class="form-card">
    <div class="form-card-body">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:72px; height:72px; border-radius:50%; background:var(--green-pale); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto;">
          👤
        </div>
        <h2 style="font-size:18px; font-weight:600; margin-top:12px;">{{ user.name }}</h2>
        <p style="font-size:13px; color:var(--text-light);">{{ user.email }}</p>
        <span style="font-size:11px; background:var(--green-pale); color:var(--green-dark); padding:3px 10px; border-radius:100px;">
          {{ user.role | upper }}
        </span>
      </div>

      <div style="border-top:1px solid #e2e8f0; padding-top:20px;">
        <p style="font-size:13px; color:var(--text-light); margin-bottom:16px;">
          Member since {{ user.created_at.strftime('%B %d, %Y') }}
        </p>
        <a href="/change-password" class="btn-predict" style="display:block; text-align:center; text-decoration:none;">
          🔒 Change password
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
