<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSmart AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f7ee; font-family: 'Segoe UI', sans-serif; }
    .hero { background: linear-gradient(135deg, #2d6a4f, #52b788); color: white; padding: 48px 0 32px; margin-bottom: 32px; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card-header { background: #2d6a4f; color: white; border-radius: 16px 16px 0 0 !important; padding: 16px 24px; }
    .btn-predict { background: #2d6a4f; color: white; border: none; padding: 12px 40px; border-radius: 8px; font-size: 16px; width: 100%; }
    .btn-predict:hover { background: #1b4332; color: white; }
    .form-label { font-weight: 500; color: #1b4332; }
    .form-control:focus { border-color: #52b788; box-shadow: 0 0 0 0.2rem rgba(82,183,136,0.25); }
    .badge-unit { background: #d8f3dc; color: #1b4332; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="hero text-center">
  <h1 style="font-size:2.5rem; font-weight:700;">🌾 AgriSmart AI</h1>
  <p style="opacity:0.85; font-size:1.1rem;">Crop recommendation and yield prediction using machine learning</p>
</div>

<div class="container" style="max-width:680px;">
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Enter soil and climate data</h5>
    </div>
    <div class="card-body p-4">
      <form action="/predict" method="POST">

        <p class="text-muted mb-3" style="font-size:14px;">Soil nutrients (kg/hectare)</p>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Nitrogen (N) <span class="badge-unit">kg/ha</span></label>
            <input type="number" name="N" class="form-control" placeholder="e.g. 90" min="0" max="140" step="0.1" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Phosphorus (P) <span class="badge-unit">kg/ha</span></label>
            <input type="number" name="P" class="form-control" placeholder="e.g. 42" min="0" max="145" step="0.1" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Potassium (K) <span class="badge-unit">kg/ha</span></label>
            <input type="number" name="K" class="form-control" placeholder="e.g. 43" min="0" max="205" step="0.1" required>
          </div>
        </div>

        <p class="text-muted mb-3" style="font-size:14px;">Climate conditions</p>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label">Temperature <span class="badge-unit">°C</span></label>
            <input type="number" name="temperature" class="form-control" placeholder="e.g. 20.8" min="0" max="50" step="0.1" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Humidity <span class="badge-unit">%</span></label>
            <input type="number" name="humidity" class="form-control" placeholder="e.g. 82.0" min="0" max="100" step="0.1" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">pH Level <span class="badge-unit">0–14</span></label>
            <input type="number" name="ph" class="form-control" placeholder="e.g. 6.5" min="0" max="14" step="0.1" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Rainfall <span class="badge-unit">mm</span></label>
            <input type="number" name="rainfall" class="form-control" placeholder="e.g. 202.9" min="0" max="300" step="0.1" required>
          </div>
        </div>

        <button type="submit" class="btn btn-predict">
          🔍 Predict Crop & Yield
        </button>

      </form>
    </div>
  </div>

  <p class="text-center text-muted mt-4" style="font-size:12px;">
    AgriSmart AI — BCA Final Year Project &nbsp;|&nbsp; Powered by Random Forest, Linear Regression & K-Means
  </p>
</div>

</body>
</html>
