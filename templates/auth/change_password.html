{% extends 'base.html' %}
{% block title %}Change Password — AgriSmart AI{% endblock %}
{% block content %}

<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:40px 24px;">
  <div style="width:100%; max-width:420px;">

    <div style="text-align:center; margin-bottom:32px;">
      <div style="font-size:48px;">🔒</div>
      <h1 style="font-size:24px; font-weight:700; color:var(--green-dark); margin-top:8px;">Change password</h1>
    </div>

    <div class="form-card">
      <div class="form-card-body">
        <form action="/change-password" method="POST">
          <div class="form-group">
            <label>Current password</label>
            <input type="password" name="current_password" required>
          </div>
          <div class="form-group">
            <label>New password</label>
            <input type="password" name="new_password" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label>Confirm new password</label>
            <input type="password" name="confirm_password" required>
          </div>
          <button type="submit" class="btn-predict">Update password</button>
        </form>
      </div>
    </div>

  </div>
</div>

{% endblock %}
