{% extends 'base.html' %}
{% block title %}Register — AgriSmart AI{% endblock %}
{% block content %}

<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:40px 24px;">
  <div style="width:100%; max-width:420px;">

    <div style="text-align:center; margin-bottom:32px;">
      <div style="font-size:48px;">🌱</div>
      <h1 style="font-size:24px; font-weight:700; color:var(--green-dark); margin-top:8px;">Create account</h1>
      <p style="color:var(--text-light); font-size:14px; margin-top:4px;">Join AgriSmart AI today</p>
    </div>

    <div class="form-card">
      <div class="form-card-body">
        <form action="/register" method="POST">
          <div class="form-group">
            <label>Full name</label>
            <input type="text" name="name" placeholder="Your full name" required>
          </div>
          <div class="form-group">
            <label>Email address</label>
            <input type="email" name="email" placeholder="you@email.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label>Confirm password</label>
            <input type="password" name="confirm_password" placeholder="Repeat password" required>
          </div>
          <button type="submit" class="btn-predict">Create account</button>
        </form>
      </div>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-light);">
      Already have an account? <a href="/login" style="color:var(--green-mid); font-weight:500;">Login here</a>
    </p>

  </div>
</div>

{% endblock %}
