{% extends 'base.html' %}
{% block title %}Login — AgriSmart AI{% endblock %}
{% block content %}

<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:40px 24px;">
  <div style="width:100%; max-width:420px;">

    <div style="text-align:center; margin-bottom:32px;">
      <div style="font-size:48px;">🌾</div>
      <h1 style="font-size:24px; font-weight:700; color:var(--green-dark); margin-top:8px;">Welcome back</h1>
      <p style="color:var(--text-light); font-size:14px; margin-top:4px;">Login to your AgriSmart account</p>
    </div>

    <div class="form-card">
      <div class="form-card-body">
        <form action="/login" method="POST">
          <div class="form-group">
            <label>Email address</label>
            <input type="email" name="email" placeholder="you@email.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Your password" required>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
            <input type="checkbox" name="remember" id="remember">
            <label for="remember" style="font-size:13px; color:var(--text-mid); font-weight:400;">Remember me</label>
          </div>
          <button type="submit" class="btn-predict">Login</button>
        </form>
      </div>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-light);">
      Don't have an account? <a href="/register" style="color:var(--green-mid); font-weight:500;">Register here</a>
    </p>

  </div>
</div>

{% endblock %}
